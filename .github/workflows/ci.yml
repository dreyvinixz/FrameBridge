name: CI

on:
  push:
    branches: [ "main", "feature/*", "integration/**", "codex/**" ]
    paths-ignore:
      - '.agents/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Keep only the latest CI run per branch; rapid audit commits should not waste runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test Streamline applied-options cache (portable C++)
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror tests/applied_options_cache_test.cpp -o /tmp/framebridge-cache-test
        /tmp/framebridge-cache-test
    - name: Test latency CSV comparison utility
      run: python3 -m unittest discover -s tests -p 'compare_latency_csv_test.py'
    - name: Run clang-format style check
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        exclude-regex: 'external/|OptiScaler/include/'

  build:
    name: Build (Windows)
    # Compile independently of formatting to expose MSVC errors during audits.
    runs-on: windows-2022
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build pinned FreeType 2.15.0 for x64
      shell: pwsh
      run: |
        $package = Join-Path $env:GITHUB_WORKSPACE 'freetype-build-artifact'
        .\scripts\Build-FreeType.ps1 -OutputDirectory $package
        Write-Host 'The freshly built package is archived for review; integration uses the tracked and hash-verified dependency.'

    - name: Upload rebuilt FreeType dependency
      uses: actions/upload-artifact@v7
      with:
        name: freetype-2.15.0-x64
        path: freetype-build-artifact/
        if-no-files-found: error

    - name: Verify active runtime integration
      shell: pwsh
      run: .\scripts\Verify-Integration.ps1

    - name: Build with MSBuild
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal

    - name: Prepare installer payload from verified build
      shell: pwsh
      run: .\scripts\Prepare-InstallerPayload.ps1

    - name: Install pinned Inno Setup 6.7.4
      id: install_inno
      shell: pwsh
      run: .\scripts\Install-InnoSetup.ps1

    - name: Compile and inspect installer payload
      shell: pwsh
      env:
        ISCC_PATH: ${{ steps.install_inno.outputs.iscc }}
      run: |
        $iscc = $env:ISCC_PATH
        if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe is missing: $iscc" }

        $outputDir = Join-Path $env:RUNNER_TEMP "FrameBridgeInstallerOutput"
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
        & $iscc "installer\setup.iss" "/O$outputDir"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

        $installer = Get-ChildItem -LiteralPath $outputDir -Filter "framebridge-setup-*.exe" -File | Select-Object -First 1
        if (-not $installer) { throw "The compiled FrameBridge installer was not produced." }

        $installDir = Join-Path $env:RUNNER_TEMP "FrameBridgeInstallerSmoke"
        $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/TYPE=full", "/TASKS=fsr4_rdna4")
        $process = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru -WindowStyle Hidden
        if ($process.ExitCode -ne 0) { throw "Silent install/extraction failed with exit code $($process.ExitCode)." }

        $requiredFiles = @(
          "dxgi.dll",
          "OptiScaler.ini",
          "libxess.dll",
          "libxess_dx11.dll",
          "amd_fidelityfx_upscaler_dx12.dll",
          "dlssg_to_fsr3_amd_is_better.dll",
          "licenses\FreeType_LICENSE.txt",
          "licenses\FTL.TXT",
          "licenses\GPLv2.TXT",
          "licenses\FakeNVAPI_LICENSE.txt",
          "licenses\XeSS_LICENSE.txt",
          "licenses\FidelityFX_v1_LICENSE.md",
          "licenses\FidelityFX_v2_LICENSE.md",
          "licenses\DirectX_LICENSE.txt",
          "docs\README.md",
          "docs\OptiScaler_Config.md"
        )
        foreach ($relativePath in $requiredFiles) {
          $installedPath = Join-Path $installDir $relativePath
          if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) { throw "Installer extraction is missing required payload: $relativePath" }
        }

        $fsr4Manifest = Get-Content "manifests\runtime-dependencies.json" -Raw | ConvertFrom-Json
        $expectedFsr4Hash = @($fsr4Manifest.release_inputs | Where-Object { $_.id -eq "amd-fsr4-upscaler" })[0].sha256
        $installedFsr4Hash = (Get-FileHash -LiteralPath (Join-Path $installDir "amd_fidelityfx_upscaler_dx12.dll") -Algorithm SHA256).Hash
        if ($installedFsr4Hash -ne $expectedFsr4Hash) { throw "Installed FSR4 payload differs from the pinned manifest hash." }

        $reportPath = Join-Path $env:RUNNER_TEMP "installer-payload-inspection.txt"
        Get-ChildItem -LiteralPath $installDir -File -Recurse | Sort-Object FullName | ForEach-Object {
          $relativePath = [IO.Path]::GetRelativePath($installDir, $_.FullName)
          $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
          "{0}`t{1}`t{2}" -f $relativePath, $_.Length, $hash
        } | Set-Content -LiteralPath $reportPath -Encoding utf8
        $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
        "installer`t{0}`t{1}" -f $installer.Length, $installerHash | Add-Content -LiteralPath $reportPath -Encoding utf8

        New-Item -ItemType Directory -Force -Path "installer\validation-output" | Out-Null
        Copy-Item -LiteralPath $installer.FullName -Destination "installer\validation-output" -Force
        Copy-Item -LiteralPath $reportPath -Destination "installer\validation-output\payload-inspection.txt" -Force
        Write-Host "Inno Setup 6.7.4 compiled; silent extraction and payload/license checks passed."

    - name: Upload non-release installer validation artifact
      uses: actions/upload-artifact@v7
      with:
        name: framebridge-installer-validation-${{ github.sha }}
        path: installer/validation-output/
        if-no-files-found: error
        retention-days: 14
