name: CI

on:
  push:
    branches: [ "main", "feature/*", "integration/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test Streamline applied-options cache (portable C++)
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror tests/applied_options_cache_test.cpp -o /tmp/framebridge-cache-test
        /tmp/framebridge-cache-test
    - name: Test latency CSV comparison utility
      run: python3 -m unittest discover -s tests -p 'compare_latency_csv_test.py'
    - name: Run clang-format style check
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        exclude-regex: 'external/|OptiScaler/include/'

  build:
    name: Build (Windows)
    needs: formatting-check
    runs-on: windows-2022
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build pinned FreeType 2.15.0 for x64
      shell: pwsh
      run: |
        $package = Join-Path $env:GITHUB_WORKSPACE 'freetype-build-artifact'
        .\scripts\Build-FreeType.ps1 -OutputDirectory $package

        $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE 'external\freetype'
        $headerRoot = Join-Path $package 'include\freetype2'
        Remove-Item -LiteralPath (Join-Path $dependencyRoot 'freetype') -Recurse -Force
        Copy-Item -LiteralPath (Join-Path $headerRoot 'freetype') -Destination $dependencyRoot -Recurse -Force
        Copy-Item -LiteralPath (Join-Path $headerRoot 'ft2build.h') -Destination $dependencyRoot -Force
        Copy-Item -LiteralPath (Join-Path $package 'lib\freetype.lib') -Destination $dependencyRoot -Force

        $versionHeader = Get-Content (Join-Path $dependencyRoot 'freetype\freetype.h') -Raw
        if ($versionHeader -notmatch '(?m)^#define FREETYPE_MAJOR\s+2' -or
            $versionHeader -notmatch '(?m)^#define FREETYPE_MINOR\s+15' -or
            $versionHeader -notmatch '(?m)^#define FREETYPE_PATCH\s+0') {
          throw 'FreeType headers staged for FrameBridge are not version 2.15.0.'
        }

    - name: Upload rebuilt FreeType dependency
      uses: actions/upload-artifact@v7
      with:
        name: freetype-2.15.0-x64
        path: freetype-build-artifact/
        if-no-files-found: error

    - name: Verify active runtime integration
      shell: pwsh
      run: .\scripts\Verify-Integration.ps1

    - name: Build with MSBuild
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal
