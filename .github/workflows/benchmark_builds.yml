name: Build FFX Runtime Validation DLL

on:
  push:
    branches: [ "feature/*", "integration/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-validation:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Verify FFX snapshot integration
      shell: pwsh
      run: .\scripts\Verify-Integration.ps1

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build with MSBuild
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: FrameBridge_FFX_Runtime_DLL
        path: x64\Release\a\OptiScaler.dll
        compression-level: 9
        if-no-files-found: error
